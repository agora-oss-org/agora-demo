name: Build and publish image

# Builds the dev-container image and pushes it to GitHub Container Registry and Docker Hub.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — a Docker Hub account/robot with push access to agoraserver/agora-demo
#   DOCKERHUB_TOKEN     — a Docker Hub access token (not the password)
# GHCR uses the built-in GITHUB_TOKEN (no secret needed).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Don't run duplicate builds for the same ref; cancel the older one.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}        # ghcr.io/jenova-marie/agora-demo
  DOCKERHUB_IMAGE: docker.io/agoraserver/agora-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # NOTE: this used to gate pulling VITE_* build-args from the `production` environment; that's gone
    # now (see the "Build and push" step below), so this only still matters if the `production`
    # environment also carries GitHub deployment-protection rules (required reviewers, wait timer) in
    # repo settings — check before removing it.
    environment: production
    permissions:
      contents: read
      packages: write       # push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build the production stage (vite build → nginx static serve), NOT the dev server. The dev
          # server serves node_modules over HTTP and gets rate-limited (429) behind a public proxy.
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No build-args: the `build` stage takes no VITE_* anymore — the `prod` stage's nginx
          # entrypoint (docker-entrypoint.d/40-agora-config.sh) fully configures the running container
          # from AGORA_DEMO_* env at start, so there's nothing left to bake at image-build time.
