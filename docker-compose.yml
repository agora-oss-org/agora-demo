# Convenience wrapper for the Agora demo dev container.
#
#   docker compose up --build          # build + run, http://localhost:5175
#   VITE_API_BASE_URL=http://host.docker.internal:4000/v7 docker compose up   # point at a host server
#
# The bind mount gives you HMR from host edits; the anonymous volume keeps the image's
# node_modules (so the host's are not required and platform-native binaries match the container).
services:
  demo:
    build:
      context: .
      # The Dockerfile's default (last) stage is `prod` (nginx) — what gets published/deployed.
      # Local compose wants the HMR dev server instead, so target the `dev` stage explicitly.
      target: dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://agora.recoverysky.net/v7}
        VITE_PROJECT_ID: ${VITE_PROJECT_ID:-11111111-1111-1111-1111-111111111111}
        VITE_DEMO_EMAIL: ${VITE_DEMO_EMAIL:-agora-demo@gmail.com}
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-DemoPass123!}
    ports:
      - "5175:5175"
    environment:
      # Runtime overrides — Vite reads these on dev-server start, no rebuild needed.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://agora.recoverysky.net/v7}
      VITE_PROJECT_ID: ${VITE_PROJECT_ID:-11111111-1111-1111-1111-111111111111}
      VITE_DEMO_EMAIL: ${VITE_DEMO_EMAIL:-agora-demo@gmail.com}
      VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-DemoPass123!}
    volumes:
      - .:/app
      - /app/node_modules
    # Lets http://host.docker.internal:4000 reach a server running on the host (needed on Linux;
    # already works on Docker Desktop for macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
