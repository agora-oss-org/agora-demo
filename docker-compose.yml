# Convenience wrapper for the Agora demo dev container.
#
#   docker compose up --build          # build + run, http://localhost:5175
#   VITE_API_BASE_URL=http://host.docker.internal:4000/v7 docker compose up   # point at a host server
#
# The bind mount gives you HMR from host edits; the anonymous volume keeps the image's
# node_modules (so the host's are not required and platform-native binaries match the container).
services:
  demo:
    build:
      context: .
      # The Dockerfile's default (last) stage is `prod` (nginx) — what gets published/deployed.
      # Local compose wants the HMR dev server instead, so target the `dev` stage explicitly.
      target: dev
      # Build-time: mirrors exactly the ARGs the Dockerfile's `dev` stage declares (baked into the
      # image's ENV as defaults). Only 4 — intentionally not the full .env set below, since the
      # Dockerfile doesn't declare ARGs for the rest. These only matter if the image is ever run
      # directly (`docker run`, no compose) — under `docker compose up`, `environment:` below always
      # overrides them anyway.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/v7}
        VITE_DEMO_EMAIL: ${VITE_DEMO_EMAIL:-agora-admin@gmail.com}
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-DemoPass123!}
    ports:
      - "5175:5175"
    environment:
      # Run-time: sourced from the AGORA_DEMO_* vars in .env (the same names/values the prod image's
      # nginx entrypoint reads), translated here to the VITE_* names the dev server's Vite process
      # actually needs — Vite only exposes VITE_-prefixed vars to import.meta.env. Read live on
      # dev-server start, no rebuild needed. ADMIN_URL/UMAMI default empty (feature hidden / analytics
      # off) and SECURE_CHAT_DEBUG defaults off, same as an unset VITE_* would bake to.
      VITE_API_BASE_URL: ${AGORA_DEMO_API_BASE_URL:-http://localhost/v7}
      VITE_DEMO_EMAIL: ${AGORA_DEMO_EMAIL:-agora-admin@gmail.com}
      VITE_DEMO_PASSWORD: ${AGORA_DEMO_PASSWORD:-DemoPass123!}
      VITE_ADMIN_URL: ${AGORA_DEMO_ADMIN_URL:-}
      VITE_AGORA_SECURE_CHAT_DEBUG: ${AGORA_DEMO_SECURE_CHAT_DEBUG:-false}
      VITE_AGORA_UMAMI_URL: ${AGORA_DEMO_UMAMI_URL:-}
      VITE_AGORA_UMAMI_DEMO_ID: ${AGORA_DEMO_UMAMI_ID:-}
      VITE_AGORA_EMAIL_REDIRECT_TO: ${AGORA_DEMO_EMAIL_REDIRECT_TO:-}
    volumes:
      - .:/app
      - /app/node_modules
    # Lets http://host.docker.internal:4000 reach a server running on the host (needed on Linux;
    # already works on Docker Desktop for macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
