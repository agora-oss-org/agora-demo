# nginx server for the production build of the Agora demo (the `prod` stage in the Dockerfile).
# Serves the static `dist/` bundle produced by `vite build` — NOT the Vite dev server. This is the
# whole point of the prod image: the dev server serves every ES module out of node_modules over HTTP
# (hundreds of requests per page load → trivially rate-limited in front of a public deploy), whereas
# the built bundle is ~a dozen hashed assets served as plain static files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly (the big JS chunk gzips ~3.4x).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets, so they're immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: this app has no router (tabs are local state; deep links ride `?entity=` on `/`),
    # but route any unknown path to index.html so a stray URL never 404s the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry HTML, so a new deploy's hashed asset references are picked up immediately.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Never cache the runtime config either — it's rewritten from AGORA_DEMO_* env by the entrypoint
    # (docker-entrypoint.d/40-agora-config.sh) on every container start, so a stale cached copy would
    # silently keep serving a previous container's values (or the image's build-time defaults).
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
